"$schema" = 'https://starship.rs/config-schema.json'

# Main format (Left side) - Only the prompt character
format = "$character "

# Right side format - End at git section
right_format = """
[](#212736)\
$username\
[](fg:#394260 bg:#212736)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[ ](bg:#769ff0)"""

[username]
show_always = true
style_user = "bg:#212736 fg:#769ff0"
style_root = "bg:#212736 fg:#769ff0"
format = '[ $user ]($style)'

[directory]
style = "fg:#769ff0 bg:#394260"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"dotfiles" = " "
"faculdade" = " "

[git_branch]
symbol = ""
style = "bg:#769ff0"
format = '[[ $symbol $branch ](fg:#e3e5e5 bg:#769ff0)]($style)'

[git_status]
style = "bg:#769ff0"
format = '[[($all_status$ahead_behind )](fg:#e3e5e5 bg:#769ff0)]($style)'

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
