[opener]
edit = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
]
image = [
	{ run = 'qimgv "$@"', desc = "qimgv", for = "unix" },
]
video = [
	{ run = 'mpv "$@"', desc = "mpv", for = "unix" },
]
pdf = [
	{ run = 'zathura "$@"', desc = "zathura", for = "unix" },
]
browser = [
	{ run = 'xdg-open "$@"', desc = "Open in Browser", for = "unix" },
]

[open]
rules = [
	{ mime = "text/html", use = "browser" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "image/*", use = "image" },
	{ mime = "video/*", use = "video" },
	{ mime = "application/pdf", use = "pdf" },
]
