[opener]
edit = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
]
image = [
	{ run = 'qimgv "$@"', orphan = true, desc = "qimgv", for = "unix" },
]
video = [
	{ run = 'mpv "$@"', orphan = true, desc = "mpv", for = "unix" },
]
pdf = [
	{ run = 'zathura "$@"', orphan = true, desc = "zathura", for = "unix" },
]
browser = [
	{ run = 'google-chrome-stable --new-window "$@"', orphan = true, desc = "Open in New Window", for = "unix" },
]
jupyter = [
	{ run = '$HOME/.local/bin/euporie-notebook "$@"', block = true, desc = "euporie", for = "unix" },
]

[open]
rules = [
	{ url = "*.ipynb", use = "jupyter" },
	{ mime = "text/html", use = "browser" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "image/*", use = "image" },
	{ mime = "video/*", use = "video" },
	{ mime = "application/pdf", use = "pdf" },
]

[preview]
rules = [
	{ url = "*.ipynb", run = '$HOME/.local/bin/euporie-preview --width "$YAZI_WIDTH" "$@" ' },
	{ mime = "{image,audio,video}/*", run = "builtin" },
	{ mime = "application/json", run = "builtin" },
	{ mime = "*", run = "builtin" },
]
